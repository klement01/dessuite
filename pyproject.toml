[build-system]
requires = ["hatchling >= 1.29"]
build-backend = "hatchling.build"

[project]
name = "dessuite"
version = "0.0.3"
authors = [{ name = "Lucas Klement", email = "lucasklementr@gmail.com" }]
description = "Suite of tools for Discrete Event Systems (DES)"
readme = "README.md"
requires-python = ">=3.14.3"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "pyparsing == 3.3.2",
  "more-itertools == 10.8.0",
  "pymodbus == 3.12.1",
  "csnake == 0.4.0",
  "pyserial == 3.5",
]

[project.urls]
Homepage = "https://github.com/klement01/des-controller"

[project.scripts]
dessuite = "dessuite.__main__:__main__"
